ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerAdmin webmaster@pematangsiantar.go.id
    DocumentRoot /var/www/html

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct execution of PHP scripts in uploads and asset directories
    <Directory /var/www/html/writable/uploads>
        <FilesMatch "\.(php|phtml|php3|php4|php5|php7|php8|phps|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/asset>
        <FilesMatch "\.(php|phtml|php3|php4|php5|php7|php8|phps|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Block direct access to internal framework directories
    <DirectoryMatch "^/var/www/html/(app|vendor|writable|database|tests)">
        Require all denied
    </DirectoryMatch>

    # Front controller index.php permission
    <Files "index.php">
        Require all granted
    </Files>

    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/sipakar_error.log
    CustomLog ${APACHE_LOG_DIR}/sipakar_access.log combined
</VirtualHost>
